name: Build Real APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - run: npm install
      - run: npm install @capacitor/core @capacitor/android @capacitor/cli
      - run: npm run build
      - run: npx cap init Dayforge com.dayforge.app --web-dir=dist || true
      - run: npx cap add android || true
      - run: npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
        ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Dayforge-Real-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
